name: Ruleaza Agentul Outlook-Gemini

on:
  workflow_dispatch: 

concurrency:
  group: agent-unic
  cancel-in-progress: false

jobs:
  ruleaza-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Preia codul
        uses: actions/checkout@v4

      - name: Instalează Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 🔥 OPTIMIZARE: Refolosește pachetele descărcate anterior

      - name: Dezactivează IPv6 pentru a preveni blocajele Google API
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Instalează dependințele
        run: pip install -r requirements.txt

      - name: Rulează Agentul
        env:
          PYTHONUNBUFFERED: 1
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u agent.py
