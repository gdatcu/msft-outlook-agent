import os
import time
import requests
import urllib.parse # Adăugat pentru a formata link-urile aplicației
import msal
from google import genai
import concurrent.futures
from datetime import datetime, timedelta, timezone

# ==========================================
# ⚙️ SETĂRI GENERALE ȘI PERSONALIZARE
# ==========================================
INTERVAL_MINUTE = 10

# Am adăugat logica pentru "Sugestie Răspuns" condiționată
REGULI_ASISTENT = """
Ești asistentul meu executiv personal. Analizează emailul de mai jos și oferă un răspuns scurt, formatat exact așa:

**📝 Rezumat:** [O propoziție clară cu esența mesajului]
**🎯 Acțiune:** [Ce trebuie să fac eu/ce să răspund. Dacă e doar informativ sau spam, scrie "Nu necesită acțiune"]
**🚨 Urgență:** [Scăzută / Medie / Critică]
**💡 Sugestie Răspuns:** [DOAR dacă Urgența este Medie sau Critică, scrie aici o propunere scurtă, politicoasă și profesională de răspuns (1-3 propoziții) pe care să o pot folosi direct. Dacă Urgența este Scăzută, omite complet această secțiune.]

REGULI STRICTE PENTRU URGENȚĂ:
- "Critică" = Doar breșe reale de securitate, mesaje vitale de la șefi/clienți direcți, sau probleme financiare grave.
- Ofertele de job, newsletterele, chitanțele, spam-ul sau notificările de marketing sunt mereu "Scăzută".
- Nu te panica la cuvinte precum "Important" puse de branduri în subiect. Fii analitic și rece.
"""

CLIENT_ID = os.environ["MS_CLIENT_ID"]
REFRESH_TOKEN = os.environ["MS_REFRESH_TOKEN"]
GEMINI_KEY = os.environ["GEMINI_API_KEY"]
DISCORD_WEBHOOK = os.environ.get("DISCORD_WEBHOOK_URL")

print("🚀 START AGENT EXECUTIV (Multithreaded + Smart Reply)...")

executor = concurrent.futures.ThreadPoolExecutor(max_workers=10)

# ==========================================
# 1. VERIFICĂM MICROSOFT PRIMII (Ieșire rapidă)
# ==========================================
print("🔐 Ne conectăm la Microsoft Graph...")
app = msal.PublicClientApplication(CLIENT_ID, authority="https://login.microsoftonline.com/consumers")
token_response = app.acquire_token_by_refresh_token(REFRESH_TOKEN, scopes=["Mail.Read"])

if "access_token" not in token_response:
    print("❌ Eroare conectare Microsoft.")
    os._exit(1)

headers = {'Authorization': f'Bearer {token_response["access_token"]}'}
ora_limita = (datetime.now(timezone.utc) - timedelta(minutes=INTERVAL_MINUTE)).strftime('%Y-%m-%dT%H:%M:%SZ')
print(f"📅 Căutăm emailuri de la ora: {ora_limita}")

endpoint = f"https://graph.microsoft.com/v1.0/me/messages?$filter=receivedDateTime ge {ora_limita}"

response = None
for incercare in range(1, 4):
    try:
        response = requests.get(endpoint, headers=headers, timeout=15)
        break
    except requests.exceptions.Timeout:
        time.sleep(2)
        
if not response or response.status_code != 200:
    print("❌ Eroare la citirea emailurilor.")
    os._exit(1)
    
emailuri = response.json().get('value', [])
if not emailuri:
    print(f"📭 Inbox gol în ultimele {INTERVAL_MINUTE} minute. Ieșire rapidă!")
    os._exit(0) 

print(f"📥 Am găsit {len(emailuri)} email(uri) nou(i)! Pornim AI-ul...")

# ==========================================
# 2. INIȚIALIZĂM ȘI VALIDĂM GEMINI 
# ==========================================
client = genai.Client(api_key=GEMINI_KEY)
lista_raw = None

for incercare in range(1, 4):
    try:
        lista_raw = executor.submit(lambda: list(client.models.list())).result(timeout=15)
        break
    except concurrent.futures.TimeoutError:
        time.sleep(2)

if not lista_raw:
    os._exit(1)

toate_modelele = [m.name for m in lista_raw if 'gemini' in m.name.lower()]
modele_flash = sorted([m for m in toate_modelele if 'flash' in m.lower()], reverse=True)
modele_de_incercat = modele_flash + sorted([m for m in toate_modelele if m not in modele_flash], reverse=True)

model_ales = None
for nume_model in modele_de_incercat:
    try:
        executor.submit(lambda: client.models.generate_content(model=nume_model, contents="salut")).result(timeout=5)
        model_ales = nume_model
        print(f"🧠 Model AI validat: {model_ales}")
        break
    except Exception:
        pass

if not model_ales:
    os._exit(1)

# ==========================================
# 3. PROCESARE PARALELĂ ȘI TRIMITERE PE DISCORD
# ==========================================
print("⚡ Analizăm emailurile simultan...")
mesaj_discord = f"🔔 **Raportul tău executiv (ultimele {INTERVAL_MINUTE} minute):**\n\n"
rezumate_valide = 0

def proceseaza_email_inteligent(email):
    subiect = email.get('subject', 'Fără subiect')
    corp = email.get('bodyPreview', 'Fără conținut')
    link_web = email.get('webLink', 'https://outlook.live.com/mail/0/inbox')
    
    # Extragem adresa expeditorului pentru a crea link-ul de aplicație (mailto)
    expeditor = email.get('from', {}).get('emailAddress', {}).get('address', '')
    
    # Construim butoanele din subsol
    if expeditor:
        # Codăm subiectul ca să nu "strice" link-ul (spațiile devin %20)
        subiect_safe = urllib.parse.quote(f"Re: {subiect}")
        link_aplicatie = f"mailto:{expeditor}?subject={subiect_safe}"
        butoane = f"🌐 **[Citește în Browser]({link_web})** | 📱 **[Răspunde din Aplicație]({link_aplicatie})**"
    else:
        butoane = f"🌐 **[Citește în Browser]({link_web})**"
    
    prompt_final = f"{REGULI_ASISTENT}\n\nSubiect: {subiect}\nText: {corp}"
    
    for _ in range(3):
        try:
            raspuns = client.models.generate_content(model=model_ales, contents=prompt_final)
            return f"📧 **{subiect}**\n{raspuns.text}\n{butoane}\n\n{'='*40}\n\n"
        except Exception:
            time.sleep(2)
    return ""

viitor_rezumate = [executor.submit(proceseaza_email_inteligent, em) for em in emailuri]

for viitor in concurrent.futures.as_completed(viitor_rezumate):
    rezultat = viitor.result(timeout=20)
    if rezultat:
        mesaj_discord += rezultat
        rezumate_valide += 1

if rezumate_valide > 0 and DISCORD_WEBHOOK:
    print("🚀 Trimitem raportul pe Discord...")
    payload = {"content": mesaj_discord[:1990]}
    try:
        requests.post(DISCORD_WEBHOOK, json=payload, timeout=10)
        print("✅ Gata!")
    except Exception:
        pass

os._exit(0)
